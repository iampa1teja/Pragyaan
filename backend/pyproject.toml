[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "iampa1teja", email = "ppavanteja@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "openai-agents>=0.22.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
